<!-- templates/order_detail.html -->
{% extends "base.html" %}

{% block content %}
<div id="order"></div>
<script>
const urlParams = new URLSearchParams(window.location.search);
const orderId = urlParams.get('id');
const token = localStorage.getItem('access');

if (!token) window.location.href = '/login/';

async function loadOrder() {
    const res = await fetch(`/api/shop/orders/${orderId}/`, {
        headers: { 'Authorization': 'Bearer ' + token }
    });
    const order = await res.json();

    document.getElementById('order').innerHTML = `
        <h2>Заказ №${order.id}</h2>
        <p><strong>Дата:</strong> ${new Date(order.created_at).toLocaleString()}</p>
        <p><strong>Статус:</strong> ${order.status}</p>
        <p><strong>Сумма:</strong> ${order.total_price} ₽</p>
        <p><strong>Адрес:</strong> ${order.delivery_address?.address_line || '-'}</p>

        <h5 class="mt-4">Товары:</h5>
        <ul class="list-group">
            ${order.items.map(i => `
                <li class="list-group-item">
                    ${i.product.name} × ${i.quantity} = ${(i.price * i.quantity).toFixed(2)} ₽
                </li>
            `).join('')}
        </ul>

        <div class="mt-4">
            <a href="/orders-history/" class="btn btn-outline-secondary">← Назад</a>
        </div>
    `;
}
loadOrder();
</script>
{% endblock %}
