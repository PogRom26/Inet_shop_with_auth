{% extends "base.html" %}

{% block title %}Корзина{% endblock %}

{% block content %}
    <h1><i class="bi bi-cart"></i> Ваша корзина</h1>

    <div id="loading" class="text-center my-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p>Загружаем корзину...</p>
    </div>

    <div id="error-message" class="alert alert-danger d-none"></div>

    <table id="cart-table" class="table table-hover d-none">
        <thead>
            <tr>
                <th>Товар</th>
                <th>Цена</th>
                <th>Кол-во</th>
                <th>Сумма</th>
                <th>Действие</th>
            </tr>
        </thead>
        <tbody id="cart-items"></tbody>
    </table>

    <div id="cart-empty" class="alert alert-info d-none">
        Корзина пуста
    </div>

    <div class="d-flex justify-content-between mt-4">
        <a href="/products/" class="btn btn-outline-secondary">Продолжить покупки</a>
        <button id="create-order-btn" class="btn btn-success btn-lg" disabled>Оформить заказ</button>
    </div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const token = localStorage.getItem('access_token');
    if (!token) {
        window.location.href = '/login/';
        return;
    }

    const loading = document.getElementById('loading');
    const errorDiv = document.getElementById('error-message');
    const table = document.getElementById('cart-table');
    const tbody = document.getElementById('cart-items');
    const emptyMsg = document.getElementById('cart-empty');
    const orderBtn = document.getElementById('create-order-btn');

    try {
        const res = await fetch('/api/shop/cart/', {
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!res.ok) {
            if (res.status === 401) {
                alert("Сессия истекла. Войдите снова.");
                window.location.href = '/login/';
                return;
            }
            throw new Error(`Ошибка: ${res.status}`);
        }

        const items = await res.json();
        console.log("Корзина:", items);

        loading.classList.add('d-none');

        if (items.length === 0) {
            emptyMsg.classList.remove('d-none');
            return;
        }

        table.classList.remove('d-none');
        orderBtn.disabled = false;

        tbody.innerHTML = items.map(item => `
            <tr>
                <td>
                    <img src="${item.image_url}" alt="${item.product_name}" style="height: 30px; object-fit: cover; margin-right: 10px;">
                    ${item.product_name}
                </td>
                <td>${item.product_price} ₽</td>
                <td>${item.quantity}</td>
                <td>${item.total_price} ₽</td>
                <td>
                    <button class="btn btn-sm btn-danger" onclick="removeFromCart(${item.id})">
                        Удалить
                    </button>
                </td>
            </tr>
        `).join('');
    } catch (err) {
        console.error(err);
        errorDiv.textContent = 'Не удалось загрузить корзину';
        errorDiv.classList.remove('d-none');
    }
});

function removeFromCart(itemId) {
    const token = localStorage.getItem('access_token');
    fetch(`/api/shop/cart/remove/${itemId}/`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
    })
    .then(() => location.reload())
    .catch(() => alert('Ошибка'));
}
</script>
{% endblock %}
