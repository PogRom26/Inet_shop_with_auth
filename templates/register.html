<!-- templates/register.html -->
{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="card-title text-center mb-4">
                    <i class="bi bi-person-plus text-primary"></i> Регистрация
                </h4>
                <form id="registerForm">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Имя пользователя</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Пароль</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
                </form>

                <div id="result" class="mt-3"></div>

                <hr>
                <p class="text-center">
                    Уже есть аккаунт?
                    <a href="/login/">Войти</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('registerForm').onsubmit = async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData);
    const div = document.getElementById('result');

    // === Шаг 1: Регистрация ===
    const registerRes = await fetch('/api/auth/register/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });

    const registerData = await registerRes.json();

    if (!registerRes.ok) {
        div.innerHTML = `
            <div class="alert alert-danger">
                <i class="bi bi-exclamation-triangle"></i>
                Ошибка: ${Object.values(registerData).flat().join(', ') || 'Неизвестная ошибка'}
            </div>
        `;
        return;
    }

    // === Шаг 2: Вход (получение токенов) ===
    const loginRes = await fetch('/api/token/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            email: data.email,
            password: data.password
        })
    });

    const tokenData = await loginRes.json();

    if (!loginRes.ok) {
        div.innerHTML = `
            <div class="alert alert-warning">
                <i class="bi bi-exclamation-triangle"></i>
                Успешно зарегистрированы, но не удалось войти. Пожалуйста, войдите вручную.
            </div>
        `;
        setTimeout(() => {
            window.location.href = '/login/';
        }, 3000);
        return;
    }

    // === Шаг 3: Сохраняем токены ===
    localStorage.setItem('access', tokenData.access);
    localStorage.setItem('refresh', tokenData.refresh);

    // === Шаг 4: Показываем успех и редиректим ===
    div.innerHTML = `
        <div class="alert alert-success">
            <i class="bi bi-check-circle"></i>
            Регистрация прошла успешно! Вход выполнен. Переходим в каталог...
        </div>
    `;

    // Блокируем форму
    e.target.querySelectorAll('button, input').forEach(el => el.disabled = true);

    // Редирект через 2 секунды
    setTimeout(() => {
        window.location.href = '/products/';
    }, 2000);
};
</script>
{% endblock %}
