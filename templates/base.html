<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}MyShop{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">MyShop</a>

            <div class="navbar-nav me-auto">
                <a class="nav-link" href="/products/">Каталог</a>
                <a class="nav-link" href="/cart/">Корзина</a>
                <a class="nav-link" href="/orders-history/">История заказов</a>
            </div>

            <div id="auth-buttons" class="d-flex">
                <!-- Управляется через JS -->
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- ✅ Ключевая строка: без неё extra_js не работает -->
    {% block extra_js %}{% endblock %}

    <script>
        // Твой updateNavbar() и другие глобальные скрипты
        function updateNavbar() {
            const authButtons = document.getElementById('auth-buttons');
            if (!authButtons) return;

            const token = localStorage.getItem('access_token');
            authButtons.innerHTML = '';

            if (token) {
                try {
                    const payload = JSON.parse(atob(token.split('.')[1]));
                    const email = payload.email || 'Пользователь';

                    authButtons.innerHTML = `
                        <span class="navbar-text text-white me-3">📧 ${email}</span>
                        <button id="logout-btn" class="btn btn-danger">Выйти</button>
                    `;

                    document.getElementById('logout-btn').addEventListener('click', () => {
                        localStorage.removeItem('access_token');
                        localStorage.removeItem('refresh_token');
                        window.location.href = '/';
                    });
                } catch (e) {
                    console.warn("Ошибка парсинга токена", e);
                    renderLoginButtons();
                }
            } else {
                renderLoginButtons();
            }
        }

        function renderLoginButtons() {
            const authButtons = document.getElementById('auth-buttons');
            authButtons.innerHTML = `
                <a href="/login/" class="btn btn-outline-light me-2">Вход</a>
                <a href="/register/" class="btn btn-primary">Регистрация</a>
            `;
        }

        document.addEventListener('DOMContentLoaded', updateNavbar);
        window.addEventListener('storage', updateNavbar);
    </script>
</body>
</html>
