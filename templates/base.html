<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}MyShop{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">MyShop</a>

            <div class="navbar-nav me-auto">
                <a class="nav-link" href="/catalog/">Каталог</a>
                <a class="nav-link" href="/cart/">Корзина</a>
                <a class="nav-link" href="/orders-history/">История заказов</a>
            </div>

            <div class="d-flex">
                {% if request.user.is_authenticated %}
                    <span class="navbar-text text-white me-3">
                        Привет, {{ request.user.email }}
                    </span>
                    <a href="/profile/" class="btn btn-outline-light me-2">Профиль</a>
                    <a href="/api/auth/logout/" class="btn btn-danger">Выйти</a>
                {% else %}
                    <a href="/login/" class="btn btn-outline-light me-2">Вход</a>
                    <a href="/register/" class="btn btn-primary">Регистрация</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script>
        // Простая проверка JWT токена при загрузке
        document.addEventListener('DOMContentLoaded', function () {
            const token = localStorage.getItem('access_token');
            const logoutBtn = document.querySelector('[href="/api/auth/logout/"]');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    localStorage.removeItem('access_token');
                    localStorage.removeItem('refresh_token');
                    window.location.href = '/';
                });
            }
        });
    </script>
</body>
</html>
