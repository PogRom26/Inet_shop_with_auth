<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}MyShop{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">MyShop</a>

            <div class="navbar-nav me-auto">
                <a class="nav-link" href="/products/">Каталог</a>
                <a class="nav-link" href="/cart/">Корзина</a>
                <a class="nav-link" href="/orders-history/">История заказов</a>
                <a class="nav-link" href="/profile/">Профиль</a>
            </div>

            <!-- Блок, который будет меняться -->
            <div id="auth-container" class="d-flex">
                <!-- Кнопки будут добавлены через JS -->
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Единый скрипт для всей навигации -->
    <script>
        function updateAuthUI() {
            const container = document.getElementById('auth-container');
            if (!container) return;

            const token = localStorage.getItem('access_token');

            // Очищаем контейнер
            container.innerHTML = '';

            if (token) {
                try {
                    // Расшифровываем JWT
                    const payload = JSON.parse(atob(token.split('.')[1]));
                    const email = payload.email || 'Пользователь';

                    container.innerHTML = `
                        <span class="navbar-text text-white me-3">📧 ${email}</span>
                        <button id="logout-btn" class="btn btn-danger">Выйти</button>
                    `;

                    // Обработчик выхода
                    document.getElementById('logout-btn').addEventListener('click', () => {
                        localStorage.removeItem('access_token');
                        localStorage.removeItem('refresh_token');
                        window.location.href = '/';
                    });
                } catch (e) {
                    console.error("Ошибка парсинга токена", e);
                    renderLoginButtons();
                }
            } else {
                renderLoginButtons();
            }
        }

        function renderLoginButtons() {
            const container = document.getElementById('auth-container');
            container.innerHTML = `
                <a href="/login/" class="btn btn-outline-light me-2">Вход</a>
                <a href="/register/" class="btn btn-primary">Регистрация</a>
            `;
        }

        // Выполняем при загрузке
        document.addEventListener('DOMContentLoaded', updateAuthUI);

        // Если токен изменился в другой вкладке
        window.addEventListener('storage', updateAuthUI);
    </script>
</body>
</html>
