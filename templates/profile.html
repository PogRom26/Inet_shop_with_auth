<!-- templates/profile.html -->
{% extends "base.html" %}

{% block title %}Личный кабинет{% endblock %}

{% block content %}
    <h2><i class="bi bi-person-fill"></i> Личный кабинет</h2>

    <div id="profileData">
        <p>Загрузка профиля...</p>
    </div>

    <div id="addresses" class="mt-4"></div>

    <div class="mt-4">
        <a href="/orders-history/" class="btn btn-outline-info me-2">
            <i class="bi bi-journal-text"></i> История заказов
        </a>
        <a href="/cart/" class="btn btn-outline-primary">
            <i class="bi bi-cart"></i> Корзина
        </a>
    </div>

    <script>
        // ✅ Исправлено: используем 'access_token', как в base.html
        const token = localStorage.getItem('access_token');
        if (!token) {
            window.location.href = '/login/';
            throw new Error("Требуется авторизация");
        }

        async function loadProfile() {
            try {
                const res = await fetch('/api/auth/profile/', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (!res.ok) {
                    if (res.status === 401) {
                        logout();
                        return;
                    }
                    throw new Error(`Ошибка: ${res.status}`);
                }

                const user = await res.json();
                document.getElementById('profileData').innerHTML = `
                    <div class="card">
                        <div class="card-body">
                            <h5>${user.email}</h5>
                            <p><strong>Имя:</strong> ${user.first_name || '-'}</p>
                            <p><strong>Фамилия:</strong> ${user.last_name || '-'}</p>
                            <p><strong>Телефон:</strong> ${user.phone || '-'}</p>
                            <button class="btn btn-sm btn-outline-secondary" onclick="editProfile('${user.email}')">
                                <i class="bi bi-pencil"></i> Редактировать
                            </button>
                        </div>
                    </div>
                `;

                loadAddresses();
            } catch (err) {
                console.error('Ошибка загрузки профиля:', err);
                document.getElementById('profileData').innerHTML = `
                    <div class="alert alert-danger">
                        Не удалось загрузить профиль. <a href="/login/">Войдите снова</a>.
                    </div>
                `;
            }
        }

        async function loadAddresses() {
            try {
                const res = await fetch('/api/auth/addresses/', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) throw new Error(`Ошибка: ${res.status}`);

                const addresses = await res.json();
                const container = document.getElementById('addresses');

                container.innerHTML += `
                    <h5><i class="bi bi-geo-alt"></i> Адреса доставки</h5>
                    <div id="addressList"></div>
                    <button class="btn btn-sm btn-outline-primary mt-2" onclick="addAddress()">
                        <i class="bi bi-plus"></i> Добавить адрес
                    </button>
                `;

                const list = document.getElementById('addressList');
                if (addresses.length === 0) {
                    list.innerHTML = '<p class="text-muted">Адреса не добавлены.</p>';
                } else {
                    list.innerHTML = addresses.map(addr => `
                        <div class="card mb-2">
                            <div class="card-body p-3">
                                <p class="mb-1"><strong>${addr.full_name}</strong></p>
                                <p class="mb-1">${addr.address_line}, ${addr.city}, ${addr.postal_code}</p>
                                <p class="mb-0">📞 ${addr.phone}</p>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteAddress(${addr.id})">
                                    Удалить
                                </button>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) {
                console.error('Ошибка загрузки адресов:', err);
                document.getElementById('addresses').innerHTML += `
                    <div class="alert alert-warning mt-3">
                        Не удалось загрузить адреса.
                    </div>
                `;
            }
        }

        function editProfile(email) {
            const name = prompt("Имя", "");
            const lastName = prompt("Фамилия", "");
            if (!name) return;

            fetch('/api/auth/profile/', {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ first_name: name, last_name: lastName })
            })
            .then(res => {
                if (res.ok) {
                    alert('Данные обновлены');
                    location.reload();
                } else {
                    alert('Ошибка при обновлении');
                }
            })
            .catch(err => {
                console.error('Ошибка запроса:', err);
                alert('Не удалось соединиться с сервером');
            });
        }

        function addAddress() {
            const full_name = prompt("ФИО");
            const phone = prompt("Телефон");
            const address_line = prompt("Адрес");
            const city = prompt("Город");
            const postal_code = prompt("Индекс");
            if (!full_name || !phone || !address_line) {
                alert("Заполните обязательные поля");
                return;
            }

            fetch('/api/auth/addresses/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ full_name, phone, address_line, city, postal_code })
            })
            .then(res => {
                if (res.ok) {
                    alert('Адрес добавлен');
                    location.reload();
                } else {
                    alert('Ошибка при добавлении');
                }
            });
        }

        function deleteAddress(id) {
            if (confirm("Удалить адрес?")) {
                fetch(`/api/auth/addresses/${id}/`, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                })
                .then(() => location.reload())
                .catch(() => alert('Ошибка при удалении'));
            }
        }

        function logout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            window.location.href = '/login/';
        }

        // Загружаем профиль при старте
        loadProfile();
    </script>
{% endblock %}
