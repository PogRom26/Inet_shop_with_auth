<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5" style="max-width: 400px;">
        <h2>Вход</h2>
        <form id="login-form">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Войти</button>
        </form>
        <p class="mt-3">
            <a href="/register/">Нет аккаунта? Зарегистрироваться</a>
        </p>
        <div id="error-message" class="alert alert-danger d-none mt-3"></div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');

            try {
                const response = await fetch('/api/token/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                if (!response.ok) {
                    const error = await response.json();
                    errorDiv.textContent = error.detail || 'Ошибка входа';
                    errorDiv.classList.remove('d-none');
                    return;
                }

                const result = await response.json();

                // ✅ Добавлено: логирование для отладки
                console.log('Ответ от /api/token/:', result);

                // Сохраняем токены
                localStorage.setItem('access_token', result.access);
                localStorage.setItem('refresh_token', result.refresh);

                // ✅ Проверим, что токены действительно сохранены
                console.log('Токены сохранены в localStorage');

                // Перенаправляем на главную
                window.location.href = '/products/';
            } catch (err) {
                console.error('Ошибка при входе:', err); // ✅ Логируем ошибку
                errorDiv.textContent = 'Ошибка сети или сервер недоступен';
                errorDiv.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
