{% extends "base.html" %}

{% block title %}Детали товара{% endblock %}

{% block content %}
    <div class="row">
        <div class="col-md-6">
            <img id="product-image" src="" class="img-fluid rounded" alt="Товар">
        </div>
        <div class="col-md-6">
            <h1 id="product-name"></h1>
            <p id="product-price" class="text-success fs-3 fw-bold"></p>
            <p id="product-description"></p>
            <button id="add-to-cart" class="btn btn-success">В корзину</button>
        </div>
    </div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const path = window.location.pathname;
    const productId = path.split('/')[2]; // /product/50/ → [2] = 50

    if (!productId) {
        document.getElementById('product-name').textContent = 'Товар не найден';
        return;
    }

    try {
        const res = await fetch(`/api/shop/products/${productId}/`);
        if (!res.ok) throw new Error('Товар не найден');

        const product = await res.json();

        document.getElementById('product-name').textContent = product.name;
        document.getElementById('product-price').textContent = `${product.price} ₽`;
        document.getElementById('product-description').textContent = product.description || 'Описание отсутствует';
        document.getElementById('product-image').src = product.image_url;

        document.getElementById('add-to-cart').onclick = () => {
            alert(`Товар "${product.name}" добавлен в корзину`);
        };
    } catch (err) {
        document.getElementById('product-name').textContent = 'Ошибка загрузки товара';
        console.error(err);
    }
});
</script>
{% endblock %}
